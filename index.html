<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拍立得繪簽</title>
  <meta name="description" content="拍立得繪簽 拍攝服務介紹：拍攝條件、價格與作品。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Pinyon+Script&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F2F2EF;        /* 霧白紙 */
      --paper: #FFFFFF;     /* 相紙 */
      --ink: #2B2926;       /* 炭墨 */
      --muted: #635E57;     /* 淡墨 */
      --line: #D9D5CE;      /* 細線 */
      --gold: #7A6638;      /* 霧金，只用在簽名與價格 */
      --photo: #E4E2DD;     /* 空相片底 */

      --serif-tc: "Noto Serif TC", "Songti TC", serif;
      --serif-en: "Cormorant Garamond", "Noto Serif TC", serif;
      --script: "Pinyon Script", cursive;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif-tc);
      font-weight: 300;
      font-size: 16px;
      line-height: 1.9;
      letter-spacing: .03em;
    }
    img { display: block; max-width: 100%; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

    /* ---------- 首屏 ---------- */
    .hero {
      text-align: center;
      padding: 88px 0 72px;
    }
    .hero h1 {
      margin: 0;
      font-family: var(--serif-tc);
      font-weight: 300;
      font-size: clamp(34px, 9vw, 52px);
      line-height: 1.3;
      letter-spacing: .32em;
      padding-left: .32em; /* 補回字距造成的視覺偏移 */
    }
    .signature {
      margin: 6px 0 0;
      font-family: var(--script);
      font-size: clamp(30px, 8vw, 40px);
      line-height: 1.2;
      color: var(--gold);
      letter-spacing: 0;
    }
    .hero .polaroid {
      width: min(340px, 100%);
      margin: 56px auto 0;
    }
    .lede {
      margin: 36px 0 0;
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 19px;
      color: var(--muted);
      letter-spacing: .02em;
    }
    .lede + .lede { margin-top: 2px; }

    /* ---------- 拍立得（擺正，不歪斜） ---------- */
    .polaroid {
      margin: 0;
      background: var(--paper);
      padding: 12px 12px 0;
      box-shadow: 0 1px 1px rgba(43,41,38,.04), 0 18px 40px -24px rgba(43,41,38,.28);
    }
    .photo {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--photo);
      overflow: hidden;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .photo .ph {
      display: none;
      position: absolute; inset: 0;
      place-items: center;
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 16px;
      color: var(--muted);
    }
    .photo.empty img { display: none; }
    .photo.empty .ph { display: grid; }
    .polaroid figcaption {
      padding: 16px 4px 22px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: .12em;
    }

    /* 唯一的動態：封面照片慢慢顯影 */
    .hero .photo img, .hero .photo .ph { animation: develop 2.4s ease-out both; }
    @keyframes develop {
      from { opacity: 0; filter: brightness(1.4) saturate(0); }
      to   { opacity: 1; filter: none; }
    }

    /* ---------- 區塊標題：中文主標 + 英文斜體副標 ---------- */
    .section { padding: 72px 0; border-top: 1px solid var(--line); }
    .heading { text-align: center; margin: 0 0 40px; }
    .heading h2 {
      margin: 0;
      font-family: var(--serif-tc);
      font-weight: 400;
      font-size: 22px;
      letter-spacing: .3em;
      padding-left: .3em;
      line-height: 1.5;
    }
    .heading .en {
      display: block;
      margin-top: 4px;
      font-family: var(--serif-en);
      font-style: italic;
      font-weight: 300;
      font-size: 18px;
      color: var(--muted);
      letter-spacing: .04em;
    }

    /* ---------- 拍攝條件 ---------- */
    .conditions {
      max-width: 34em;
      margin: 0 auto;
      padding: 0;
      list-style: none;
    }
    .conditions li {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .conditions li:first-child { border-top: 1px solid var(--line); }
    .conditions li { display: flex; gap: 1.1em; align-items: baseline; }
    .conditions .num {
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 19px;
      color: var(--gold);
      font-variant-numeric: lining-nums;
      flex: none;
    }
    .conditions .todo { color: var(--muted); }

    /* ---------- 價格 ---------- */
    /* 放在拍攝條件最後一條底線下方，靠右 */
    .price {
      max-width: 34em;
      margin: 24px auto 0;
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 1.2em;
      line-height: 1.4;
    }
    .price .label {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: .2em;
    }
    .price .label .en {
      margin-left: .4em;
      font-family: var(--serif-en);
      font-style: italic;
      font-weight: 300;
      font-size: 19px;
      color: var(--muted);
      letter-spacing: .04em;
    }
    /* 數字用和頁首簽名同一款手寫體 */
    .price .amount {
      margin: 0;
      font-family: var(--script);
      font-weight: 400;
      font-size: 24px;
      letter-spacing: .02em;
    }
    .price .unit {
      /* 和旁邊的 Price 同字體、同大小 */
      font-family: var(--serif-en);
      font-style: italic;
      font-weight: 300;
      font-size: 19px;
      color: var(--gold);
      margin-left: .25em;
    }

    /* ---------- 作品 ---------- */
    /* 翻頁式：一次看一張，可左右滑或按箭頭 */
    .carousel {
      position: relative;
      max-width: 520px;
      margin: 0 auto;
      border: 1px solid var(--line);
    }
    .track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .track::-webkit-scrollbar { display: none; }
    .slide {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: flex;
      justify-content: center;
      padding: 32px 0;
    }
    .slide .polaroid { width: min(240px, 62%); }
    /* 署名：和標題下方同一款英文草寫 */
    .slide figcaption {
      font-family: var(--script);
      font-size: 24px;
      line-height: 1.2;
      color: var(--gold);
      text-align: left;
      letter-spacing: 0;
      padding: 14px 6px 18px;
    }
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif-en);
      font-size: 24px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0 0 3px;
    }
    .nav:disabled { opacity: .35; cursor: default; }
    .nav:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .nav.prev { left: 10px; }
    .nav.next { right: 10px; }
    .pager {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 20px;
    }
    .dots { display: flex; gap: 10px; }
    .dots button {
      width: 9px; height: 9px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .dots button[aria-current="true"] { background: var(--muted); }
    .count {
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 17px;
      color: var(--muted);
      font-variant-numeric: lining-nums;
    }

    footer {
      text-align: center;
      padding: 48px 16px 56px;
      border-top: 1px solid var(--line);
    }
    footer .signature { font-size: 28px; margin: 0; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <header class="wrap hero">
    <h1>拍立得繪簽</h1>
    <p class="signature">Polaroid &amp; Signature</p>
    <figure class="polaroid">
      <div class="photo">
        <!-- 封面照片：放一張圖到 images/hero.jpg 就會自動顯示 -->
        <img src="images/hero.jpg" alt="拍立得繪簽封面作品" onerror="this.parentElement.classList.add('empty')">
        <span class="ph">cover photo</span>
      </div>
    </figure>
    <p class="lede">a photograph, signed by hand,</p>
    <p class="lede">to keep the moments that are yours alone</p>
  </header>

  <main class="wrap">
    <section class="section">
      <div class="heading">
        <h2>拍攝條件及流程</h2>
        <span class="en">Conditions &amp; Process</span>
      </div>
      <!-- 在這裡補上拍攝條件：把「（待補）」換成內容，並把 class="todo" 拿掉；要加第 4 條就複製一行、編號改 04 -->
      <ul class="conditions">
        <li><span class="num">01</span><span class="todo">（待補）</span></li>
        <li><span class="num">02</span><span class="todo">（待補）</span></li>
        <li><span class="num">03</span><span class="todo">（待補）</span></li>
      </ul>
      <div class="price">
        <span class="label">價格<span class="en">Price</span></span>
        <p class="amount">250,000<span class="unit">gil</span></p>
      </div>
    </section>

    <section class="section">
      <div class="heading">
        <h2>作品</h2>
        <span class="en">Works</span>
      </div>
      <!-- 作品圖：把圖片放到 images/ 資料夾，檔名對上 work-1.jpg、work-2.jpg、work-3.jpg 即可 -->
      <!-- 想多放幾張：複製一整段 <div class="slide">…</div>，圓點和頁碼會自動增加 -->
      <div class="carousel">
        <div class="track" id="track">
          <div class="slide">
            <figure class="polaroid">
              <div class="photo">
                <img src="images/work-1.jpg" alt="作品一" onerror="this.parentElement.classList.add('empty')">
                <span class="ph">work i</span>
              </div>
              <figcaption>Photo by Iara</figcaption>
            </figure>
          </div>
          <div class="slide">
            <figure class="polaroid">
              <div class="photo">
                <img src="images/work-2.jpg" alt="作品二" onerror="this.parentElement.classList.add('empty')">
                <span class="ph">work ii</span>
              </div>
              <figcaption>Photo by Iara</figcaption>
            </figure>
          </div>
          <div class="slide">
            <figure class="polaroid">
              <div class="photo">
                <img src="images/work-3.jpg" alt="作品三" onerror="this.parentElement.classList.add('empty')">
                <span class="ph">work iii</span>
              </div>
              <figcaption>Photo by Iara</figcaption>
            </figure>
          </div>
        </div>
        <button class="nav prev" type="button" aria-label="上一張">‹</button>
        <button class="nav next" type="button" aria-label="下一張">›</button>
      </div>
      <div class="pager">
        <div class="dots" id="dots"></div>
        <span class="count" id="count"></span>
      </div>
    </section>
  </main>

  <footer>
    <p class="signature">Polaroid &amp; Signature</p>
  </footer>

  <script>
    (function () {
      var track = document.getElementById('track');
      var slides = track.querySelectorAll('.slide');
      var dotsBox = document.getElementById('dots');
      var count = document.getElementById('count');
      var prev = document.querySelector('.nav.prev');
      var next = document.querySelector('.nav.next');
      var total = slides.length;
      var current = 0;

      function go(i) {
        i = Math.max(0, Math.min(total - 1, i));
        track.scrollTo({ left: i * track.clientWidth });
      }

      for (var i = 0; i < total; i++) {
        var d = document.createElement('button');
        d.type = 'button';
        d.setAttribute('aria-label', '第 ' + (i + 1) + ' 張');
        d.addEventListener('click', go.bind(null, i));
        dotsBox.appendChild(d);
      }
      var dots = dotsBox.querySelectorAll('button');

      function update() {
        current = Math.round(track.scrollLeft / track.clientWidth);
        dots.forEach(function (d, i) { d.setAttribute('aria-current', i === current ? 'true' : 'false'); });
        count.textContent = (current + 1) + ' / ' + total;
        prev.disabled = current === 0;
        next.disabled = current === total - 1;
      }

      prev.addEventListener('click', function () { go(current - 1); });
      next.addEventListener('click', function () { go(current + 1); });
      track.addEventListener('scroll', function () { window.requestAnimationFrame(update); });
      window.addEventListener('resize', function () { go(current); });
      update();
    })();
  </script>
</body>
</html>
